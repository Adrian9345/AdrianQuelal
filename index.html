<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raigal</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
    <style>
      body {
        margin: 0;
        background-color: #f5f5f5;
      }
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined' !important;
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-feature-settings: 'liga';
        -webkit-font-smoothing: antialiased;
        text-transform: none;
        letter-spacing: normal;
        line-height: 1;
      }
    </style>
    <script>
      // Automatically safeguard all icon ligatures from being broken by browser auto-translators like Google Translate
      const observer = new MutationObserver((mutations) => {
        for (let i = 0; i < mutations.length; i++) {
          const addedNodes = mutations[i].addedNodes;
          for (let j = 0; j < addedNodes.length; j++) {
            const node = addedNodes[j];
            if (node.nodeType === 1) { // ELEMENT_NODE
              if (node.classList && node.classList.contains('material-symbols-outlined')) {
                node.setAttribute('translate', 'no');
                node.classList.add('notranslate');
              }
              const children = node.getElementsByClassName('material-symbols-outlined');
              for (let k = 0; k < children.length; k++) {
                children[k].setAttribute('translate', 'no');
                children[k].classList.add('notranslate');
              }
            }
          }
        }
      });
      observer.observe(document.documentElement, {
        childList: true,
        subtree: true
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
